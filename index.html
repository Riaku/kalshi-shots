<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kevin’s Wedding — Parlay Card</title>
<meta name="description" content="Fake prediction markets for a wedding. Most drunk, first to cry, who asks for shots first. Not real. Not Kalshi.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d10'/%3E%3Cpath d='M9 8v16M9 17l8-9M9 17l9 7' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff; --bg-soft:#f6f7f9; --card:#fff; --text:#0b0d10; --muted:#6b7280;
    --line:#e6e8eb; --line-soft:#f0f2f4;
    --green:#0a9d6d; --green-soft:#e7f7f0; --red:#e5484d; --red-soft:#fdeeee;
    --amber:#b45309; --amber-soft:#fff7ed;
    --hover:#f4f5f7; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
    --grid:rgba(11,13,16,.09);
  }
  [data-theme="dark"]{
    --bg:#0b0d10; --bg-soft:#0f1216; --card:#11151a; --text:#f2f4f6; --muted:#a4aebc;
    --line:#222a32; --line-soft:#1a2027;
    --green:#2bd39b; --green-soft:#0e2a22; --red:#ff6b6b; --red-soft:#2a1518;
    --amber:#fbbf24; --amber-soft:#2a2010;
    --hover:#181e25; --shadow:0 1px 2px rgba(0,0,0,.4); --grid:rgba(255,255,255,.13);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;overflow:hidden;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
  a{color:inherit;text-decoration:none}
  .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .wrap{width:100%;max-width:1440px;margin:0 auto;padding:0 18px}

  header{flex:0 0 auto;border-bottom:1px solid var(--line);background:var(--bg);z-index:20}
  .nav{display:flex;align-items:center;gap:18px;height:50px}
  .brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15.5px;letter-spacing:-.3px}
  .chip{font-size:8.5px;font-weight:700;letter-spacing:.9px;padding:2px 4px;border:1px solid var(--line);
    border-radius:4px;color:var(--muted);text-transform:uppercase}
  .navlinks{display:flex;gap:2px}
  .navlinks a{padding:6px 9px;border-radius:7px;color:var(--muted);font-weight:500;font-size:12.5px}
  .navlinks a:hover{background:var(--hover);color:var(--text)}
  .navlinks a.on{color:var(--text);font-weight:600}
  .navright{display:flex;align-items:center;gap:9px;margin-left:auto}
  .bal{text-align:right;line-height:1.1}
  .bal .k{font-size:8.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  .bal .v{font-weight:600;font-size:12.5px}
  .btn{border-radius:8px;padding:7px 11px;font-weight:600;font-size:12px;background:var(--text);color:var(--bg)}
  .btn:hover{opacity:.87}
  .ibtn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
  .ibtn:hover{background:var(--hover);color:var(--text)}
  .av{width:27px;height:27px;border-radius:50%;background:linear-gradient(135deg,#5b7cfa,#9b5bfa);
    color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}

  .ticker{height:26px;overflow:hidden;background:var(--bg-soft);border-bottom:1px solid var(--line);position:relative}
  .ticker-in{display:flex;gap:26px;align-items:center;height:26px;white-space:nowrap;
    animation:slide 70s linear infinite;padding-left:18px}
  .ticker:hover .ticker-in{animation-play-state:paused}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .tk{display:inline-flex;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
  .tk b{color:var(--text);font-weight:600}
  .tk i{font-style:normal;color:var(--muted);font-size:10px;opacity:.75;max-width:190px;overflow:hidden;
    text-overflow:ellipsis}
  .tk .done{color:var(--green);font-weight:700}
  .up{color:var(--green)} .down{color:var(--red)}

  main{flex:1 1 auto;min-height:0;width:100%;max-width:1440px;margin:0 auto;padding:12px 18px;
    display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}

  /* ---------- board ---------- */
  .bhead{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
  .bhead h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.3px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .bhead .evt{font-size:10.5px;color:var(--muted);white-space:nowrap}
  .bhead .pills{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
  .pill{font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:3px 7px;
    border-radius:20px;border:1px solid var(--line);color:var(--muted)}
  .pill.g{color:var(--green);border-color:var(--green);background:var(--green-soft)}
  .pill.o{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}

  .board{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .brow{flex:1 1 0;min-height:0;display:grid;grid-template-columns:20px minmax(0,1fr) auto 44px;gap:12px;
    align-items:center;padding:0 14px;border-bottom:1px solid var(--line-soft);cursor:pointer;
    transition:background .12s}
  .brow:last-child{border-bottom:0}
  .brow:hover{background:var(--hover)}
  .brow.sel{background:var(--bg-soft);box-shadow:inset 2px 0 0 var(--text)}
  .brow.done{opacity:.92}
  .st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;
    font-size:9px;font-weight:700;color:var(--muted);flex:0 0 auto}
  .st.ok{background:var(--green);border-color:var(--green);color:#fff}
  .q{min-width:0;line-height:1.25}
  .q b{font-size:12.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .q span.win{color:var(--green);font-weight:700}
  .picks{display:flex;gap:5px;align-items:center;flex:0 0 auto;width:264px;justify-content:flex-end;overflow:hidden}
  .pick{display:inline-flex;align-items:baseline;gap:4px;border:1px solid var(--line);border-radius:6px;
    padding:3px 6px;font-size:10.5px;color:var(--muted);white-space:nowrap;background:var(--card)}
  .pick b{color:var(--text);font-weight:600}
  .pick.lead{border-color:var(--text);color:var(--text)}
  .pick.won{border-color:var(--green);background:var(--green-soft);color:var(--green)}
  .pick.won b{color:var(--green)}
  .brow .arrow{font-size:15px;color:var(--muted);text-align:right}

  /* ---------- slip ---------- */
  .shead{flex:0 0 auto;padding:10px 13px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px}
  .shead b{font-weight:700;letter-spacing:.4px;text-transform:uppercase;font-size:9.5px;color:var(--muted)}
  .shead .stt{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
    color:var(--amber)}
  .shead .stt.g{color:var(--green)}
  .mtitle{flex:0 0 auto;padding:9px 13px 4px}
  .mtitle b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.2px;line-height:1.25}
  .mtitle span{display:block;font-size:10.5px;color:var(--muted);margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .chartwrap{flex:1 1 auto;min-height:96px;position:relative;padding:0 6px}
  svg.chart{display:block}
  .tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:10px;
    padding:3px 6px;border-radius:5px;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5;
    transform:translate(-50%,-135%)}
  .rng{flex:0 0 auto;display:flex;gap:4px;justify-content:flex-end;padding:2px 12px 6px}
  .rng button{font-size:9.5px;font-weight:600;color:var(--muted);padding:2px 6px;border-radius:5px;
    border:1px solid transparent}
  .rng button.on{color:var(--text);border-color:var(--line);background:var(--bg-soft)}

  .cands{flex:0 0 auto;border-top:1px solid var(--line-soft);overflow:hidden;display:flex;flex-direction:column}
  .cand{display:flex;align-items:center;gap:8px;padding:0 13px;height:26px;flex:0 0 auto;
    border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:11.5px}
  .cand:last-child{border-bottom:0}
  .cand:hover{background:var(--hover)}
  .cand.on{background:var(--bg-soft);box-shadow:inset 2px 0 0 var(--text)}
  .cand .cav{width:16px;height:16px;border-radius:50%;background:var(--bg-soft);border:1px solid var(--line);
    display:grid;place-items:center;font-size:8px;font-weight:700;flex:0 0 auto}
  .cand .cn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cand .cv{margin-left:auto;font-weight:700;font-size:12px}
  .cand .cq{font-size:9.5px;color:var(--muted);width:26px;text-align:right}

  .ticket{flex:0 0 auto;border-top:1px solid var(--line);padding:9px 12px;background:var(--bg-soft)}
  .trow{display:flex;align-items:center;gap:8px}
  .trow .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .trow .px{font-size:17px;font-weight:700;letter-spacing:-.5px;margin-left:auto}
  .obtn{flex:1 1 0;padding:8px;border-radius:8px;font-weight:700;font-size:11.5px;border:1px solid var(--line);
    background:var(--card)}
  .obtn.y{border-color:var(--green);color:var(--green)}
  .obtn.y:hover{background:var(--green);color:#fff}
  .obtn.y.on{background:var(--green);color:#fff}
  .obtn.n{border-color:var(--red);color:var(--red)}
  .obtn.n:hover{background:var(--red);color:#fff}
  .obtn.n.on{background:var(--red);color:#fff}
  .slipbar{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:10.5px;color:var(--muted)}
  .slipbar b{color:var(--text);font-weight:600}
  .place{background:var(--text);color:var(--bg);border-radius:7px;padding:6px 10px;font-weight:700;
    font-size:10.5px;margin-left:auto;white-space:nowrap}
  .place:hover{opacity:.87}
  .clearbtn{font-size:9.5px;color:var(--muted);text-decoration:underline;flex:0 0 auto}

  .settled{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:1px;padding:10px;background:var(--green-soft)}
  .settled .badge{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--green)}
  .settled .who{font-size:25px;font-weight:700;letter-spacing:-.9px;color:var(--text)}
  .settled .at{font-size:10.5px;color:var(--muted)}

  footer{flex:0 0 auto;border-top:1px solid var(--line);padding:5px 0}
  footer .in{display:flex;gap:12px;align-items:center;font-size:10px;color:var(--muted)}
  footer .in span+span{margin-left:auto;white-space:nowrap}

  #toasts{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:200;display:flex;
    flex-direction:column;gap:7px;align-items:center;pointer-events:none;width:calc(100% - 30px);max-width:440px}
  .toast{background:var(--text);color:var(--bg);padding:9px 13px;border-radius:9px;font-size:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.18);animation:tin .22s ease-out;max-width:100%}
  @keyframes tin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

  @media(max-width:480px){ .bal{display:none} .navright{gap:6px} .wrap{padding:0 12px}
    main{padding:8px 10px} }
  @media(max-width:1080px){
    main{grid-template-columns:minmax(0,1fr) 344px}
    .picks{width:210px}
  }
  @media(max-width:900px){
    body{overflow:auto;height:auto;min-height:100%}
    main{grid-template-columns:1fr;padding:10px 12px}
    .brow{flex:0 0 auto;min-height:58px;grid-template-columns:20px minmax(0,1fr) 44px;row-gap:3px;
      padding:8px 12px}
    .picks{grid-column:2/4;width:auto;max-width:100%;flex-wrap:wrap;gap:4px;justify-content:flex-start}
    .q b{white-space:normal}
    .chartwrap{min-height:130px}
    .navlinks{display:none}
    .nav{gap:10px}
    .cand{height:30px}
    .bhead{gap:8px;padding:9px 12px}
    .bhead .evt{display:none}
    .bhead h1{font-size:14px}
    .pill{font-size:9px;padding:2px 6px}
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="#">
      <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="currentColor"/>
        <path d="M9.5 8v16M9.5 17l7.5-9M9.5 17l8.5 7" stroke="var(--bg)" stroke-width="2.6"
              stroke-linecap="round" fill="none"/>
      </svg>
      Kalshi <span class="chip">demo</span>
    </a>
    <nav class="navlinks">
      <a href="#" class="on">Wedding card</a>
      <a href="#" data-fake="Portfolio">Portfolio</a>
      <a href="#" data-fake="Activity">Activity</a>
      <a href="#" data-fake="Leaderboard">Leaderboard</a>
    </nav>
    <div class="navright">
      <div class="bal"><div class="k">Balance</div><div class="v mono" id="balance">$1,000.00</div></div>
      <button class="btn" id="deposit">Deposit</button>
      <button class="ibtn" id="theme" title="Toggle theme">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
      <div class="av">K</div>
    </div>
  </div>
  <div class="ticker"><div class="ticker-in" id="ticker"></div></div>
</header>

<main>
  <section class="card">
    <div class="bhead">
      <h1>Kevin’s wedding</h1>
      <span class="evt">11 markets · one card</span>
      <div class="pills">
        <span class="pill o" id="pillOpen">6 open</span>
        <span class="pill g" id="pillDone">5 settled</span>
      </div>
    </div>
    <div class="board" id="board"></div>
  </section>

  <section class="card">
    <div class="shead"><b id="slipKicker">Market</b><span class="stt" id="slipStatus">Open</span></div>
    <div class="mtitle"><b id="mTitle">Most drunk</b><span id="mSub">Who is leaving the reception sideways.</span></div>
    <div class="chartwrap" id="cw"><svg class="chart" id="chart"></svg><div class="tip" id="tip"></div></div>
    <div class="rng" id="rng"></div>
    <div class="cands" id="cands"></div>
    <div class="ticket" id="ticket"></div>
  </section>
</main>

<footer>
  <div class="wrap in">
    <span>Not Kalshi. Fake prices, fake charts, fake money — a joke for Kevin’s wedding.</span>
    <span id="clock">Last update just now</span>
  </div>
</footer>

<div id="toasts"></div>

<script>
(function(){
  "use strict";

  var $ = function(s){ return document.querySelector(s); };
  var money0 = function(n){ return "$" + Math.round(n).toLocaleString("en-US"); };
  var clamp = function(v,a,b){ return Math.max(a, Math.min(b, v)); };
  var cents = function(v){ return Math.round(v) + "\u00A2"; };

  function hashStr(s){
    var h = 2166136261;
    for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function balance(ev){
    var sum = ev.outcomes.reduce(function(a,o){ return a + o.px; }, 0);
    var big = ev.outcomes.reduce(function(m,o){ return o.px > m.px ? o : m; }, ev.outcomes[0]);
    big.px = clamp(big.px + (100 - sum), 1, 99);
  }

  /* one market per form question. winner = settled at 100c, null = still open. */
  var EVENTS = [
    { key:"drunk",  q:"Most drunk", sub:"Reception, after the first speech.", winner:null,
      outcomes:[["Axel",27],["Sessu",18],["Eddie",14],["Jay",11],["Boomer",9],
                ["Maddie",7],["Zero",5],["Disjoint",4],["Ari",3],["Apollo",2]] },

    { key:"vape",   q:"Who’s gonna vape during the ceremony", sub:"Kevin called it: Skippy.", winner:"Skippy",
      outcomes:[["Skippy",58],["Jay",13],["Boomer",10],["Eddie",8],["Fisk",6],["Someone else",5]] },

    { key:"decks",  q:"Ask to take over the decks", sub:"One song. It’s always one song.", winner:null,
      outcomes:[["Videl",31],["Fisk",24],["Jay",18],["Carcar",12],["Fleck",9],["Sky",6]] },

    { key:"dressed",q:"Who’s gonna be worst dressed", sub:"Kevin called it: Sam. Sorry, Sam.", winner:null,
      outcomes:[["Sam",44],["Axel",16],["Boomer",12],["Fisk",10],["Eddie",9],["Someone else",9]] },

    { key:"spill",  q:"First to spill drink", sub:"Apollo. Long sleeves, full glass.", winner:"Apollo",
      outcomes:[["Eddie",34],["Miko",18],["Shiro",15],["Rory",12],["Jay",9],["Skippy",7],["Boomer",5],["Apollo",1]] },

    { key:"stairs", q:"Fall down stairs", sub:"Kevin called it: Pox. Concerning.", winner:null,
      outcomes:[["Pox",52],["Boomer",14],["Eddie",11],["Axel",9],["Shiro",7],["Someone else",7]] },

    { key:"cry",    q:"First to cry", sub:"Vows or speeches. Both count.", winner:"Mackie",
      outcomes:[["Axel",29],["Maddie",21],["Jyno",15],["Videl",12],["Shiro",10],["Carly",8],["Jay",5],["Mackie",1]] },

    { key:"cutoff", q:"Who’s gonna get cut off from the bar", sub:"Kevin called it: Fleck. Legend.", winner:null,
      outcomes:[["Fleck",47],["Boomer",16],["Eddie",13],["Jay",10],["Skippy",8],["Someone else",6]] },

    { key:"bed",    q:"First to go to bed", sub:"Someone always vanishes by 9:30.", winner:null,
      outcomes:[["Shiro",36],["Kurama",17],["Kiba",14],["Ryno",12],["Jake",9],["Rory",7],["Mav",5]] },

    { key:"shots",  q:"Who asks for shots first", sub:"The original market. Sessu, obviously.", winner:"Sessu",
      outcomes:[["Sessu",40],["Jay",24],["Axel",15],["Carcar",11],["Alazel",6],["Fisk",4]] },

    { key:"last",   q:"Who’s gonna show up last", sub:"Free text on the form. We priced it anyway.", winner:null,
      outcomes:[["Axel",33],["Sessu",26],["Jay",15],["Fisk",12],["Carcar",8],["Alazel",6]] }
  ];

  EVENTS.forEach(function(ev){
    ev.outcomes = ev.outcomes.map(function(a){
      return { name:a[0], px:a[1], vol:2400 + hashStr(ev.key + a[0]) % 19000 };
    });
    if(ev.winner){
      ev.outcomes.forEach(function(o){ o.px = (o.name === ev.winner) ? 100 : 0; o.chg = 0; });
      ev.outcomes.sort(function(a,b){ return b.px - a.px || a.name.localeCompare(b.name); });
    } else {
      balance(ev);
      ev.outcomes.forEach(function(o){
        o.chg = Math.round(((hashStr(ev.key + o.name + "c") % 90) / 10 - 4.4) * 10) / 10;
      });
    }
  });

  var state = { ei:0, out:0, range:"1D" };
  var legs = {};   /* "ei-oi-side" */

  var cur = function(){ return EVENTS[state.ei]; };
  var curOut = function(){ return cur().outcomes[state.out]; };
  var isSettled = function(){ return !!cur().winner; };

  /* ---------- history ---------- */
  var cache = {};
  function series(ei, oi, range){
    var k = ei + "|" + oi + "|" + range;
    if(cache[k]) return cache[k];
    var o = EVENTS[ei].outcomes[oi];
    var n = range === "1D" ? 90 : range === "1W" ? 150 : 260;
    var mult = range === "1D" ? 1 : range === "1W" ? 2.4 : 4.8;
    var rnd = mulberry32(hashStr(EVENTS[ei].key + o.name + range));
    var end = o.px, start = clamp(end - o.chg * mult, 0, 100);
    var vol = 0.32 + Math.max(o.px, 6) * 0.03;
    var walk = [0], x = 0, i;
    for(i=1;i<n;i++){
      var step = (rnd()-0.5) * vol;
      if(rnd() < 0.03) step *= 3.4;
      x += step; walk.push(x);
    }
    var drift = walk[n-1], out = [];
    for(i=0;i<n;i++){
      var t = i/(n-1);
      out.push(clamp(start + (end-start)*t + (walk[i] - drift*t), 0, 100));
    }
    out[n-1] = end;
    cache[k] = out;
    return out;
  }
  function advance(){
    Object.keys(cache).forEach(function(k){
      var p = k.split("|"), ev = EVENTS[+p[0]], o = ev && ev.outcomes[+p[1]];
      var s = cache[k];
      if(!s || !o) return;
      s.shift(); s.push(o.px);
    });
  }

  /* ---------- chart ---------- */
  var CW = 340, CH = 150, PL = 26, PR = 38, PT = 8, PB = 16;
  var svg = $("#chart");

  function measure(){
    var el = $("#cw");
    if(!el){ return false; }
    CW = Math.max(200, Math.round(el.clientWidth - 12));
    CH = Math.max(80, Math.round(el.getBoundingClientRect().height));
    svg.setAttribute("width", CW);
    svg.setAttribute("height", CH);
    svg.setAttribute("viewBox", "0 0 " + CW + " " + CH);
    return true;
  }
  function xAt(i,n){ return PL + (CW-PL-PR) * (n===1 ? 0 : i/(n-1)); }
  function yAt(v,lo,hi){ return PT + (CH-PT-PB) * (1 - (v-lo)/(hi-lo || 1)); }

  function draw(){
    if(!document.getElementById("cw")) return;
    var o = curOut(), s = series(state.ei, state.out, state.range);
    var lo = Math.min.apply(null,s), hi = Math.max.apply(null,s);
    var m = Math.max(1.5, (hi-lo)*0.15);
    lo = Math.max(0, lo-m); hi = Math.min(100, hi+m);
    if(hi-lo < 6){ hi = Math.min(100, lo+6); }

    var p = [], i;
    [0, 0.5, 1].forEach(function(f){
      var v = lo + (hi-lo)*f, y = yAt(v,lo,hi);
      p.push('<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(CW-PR)+'" y2="'+y.toFixed(1)+
        '" stroke="var(--grid)"/>');
      p.push('<text x="'+(PL-5)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="8.5" '+
        'fill="currentColor" fill-opacity="0.4">'+Math.round(v)+'</text>');
    });

    var d = "";
    for(i=0;i<s.length;i++){
      d += (i?"L":"M") + xAt(i,s.length).toFixed(1) + " " + yAt(s[i],lo,hi).toFixed(1) + " ";
    }
    p.push('<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="var(--green)" stop-opacity="0.18"/>'+
      '<stop offset="100%" stop-color="var(--green)" stop-opacity="0"/></linearGradient></defs>');
    p.push('<path d="'+d+'L'+(CW-PR)+' '+(CH-PB)+' L'+PL+' '+(CH-PB)+' Z" fill="url(#g1)"/>');
    p.push('<path d="'+d+'" fill="none" stroke="var(--green)" stroke-width="1.7" '+
      'stroke-linejoin="round" stroke-linecap="round"/>');

    var lastY = clamp(yAt(o.px,lo,hi), PT+7, CH-PB-7);
    p.push('<line x1="'+PL+'" y1="'+lastY.toFixed(1)+'" x2="'+(CW-PR)+'" y2="'+lastY.toFixed(1)+
      '" stroke="var(--green)" stroke-opacity="0.45" stroke-dasharray="3 4"/>');
    p.push('<rect x="'+(CW-PR+2)+'" y="'+(lastY-7).toFixed(1)+'" width="32" height="14" rx="4" fill="var(--green)"/>');
    p.push('<text x="'+(CW-PR+18)+'" y="'+(lastY+3).toFixed(1)+'" text-anchor="middle" font-size="8.5" '+
      'font-weight="700" fill="#fff">'+Math.round(o.px)+'</text>');

    p.push('<g id="cross" style="display:none"><line id="cl" y1="'+PT+'" y2="'+(CH-PB)+
      '" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="3 3"/>'+
      '<circle id="cd" r="3" fill="var(--green)" stroke="var(--card)" stroke-width="1.6"/></g>');

    svg.innerHTML = p.join("");
    bindCross(s, lo, hi);
  }

  function bindCross(s, lo, hi){
    var tip = $("#tip"), box = $("#cw");
    if(!tip || !box) return;
    var grp = svg.querySelector("#cross"), line = svg.querySelector("#cl"), dot = svg.querySelector("#cd");
    if(!grp) return;
    svg.onmousemove = function(e){
      var r = svg.getBoundingClientRect(), br = box.getBoundingClientRect();
      var t = clamp((e.clientX - r.left - PL) / (CW-PL-PR), 0, 1);
      var idx = Math.round(t * (s.length-1));
      var x = xAt(idx, s.length), y = yAt(s[idx], lo, hi);
      grp.style.display = "";
      line.setAttribute("x1", x); line.setAttribute("x2", x);
      dot.setAttribute("cx", x); dot.setAttribute("cy", y);
      tip.style.left = (r.left - br.left + x) + "px";
      tip.style.top = (r.top - br.top + y) + "px";
      tip.style.opacity = 1;
      tip.textContent = cents(s[idx]);
    };
    svg.onmouseleave = function(){ grp.style.display = "none"; tip.style.opacity = 0; };
  }

  /* ---------- board ---------- */
  function renderBoard(){
    var open = EVENTS.filter(function(e){ return !e.winner; }).length;
    $("#pillOpen").textContent = open + " open";
    $("#pillDone").textContent = (EVENTS.length - open) + " settled";

    $("#board").innerHTML = EVENTS.map(function(ev,ei){
      var picks;
      if(ev.winner){
        picks = '<span class="pick won"><b>'+ev.winner+'</b> 100\u00A2</span>';
      } else {
        var ranked = ev.outcomes.slice().sort(function(a,b){
          return (b.px - a.px) || a.name.localeCompare(b.name);
        });
        picks = ranked.slice(0,3).map(function(o,j){
          return '<span class="pick '+(j===0?"lead":"")+'"><b>'+o.name+'</b> '+cents(o.px)+'</span>';
        }).join("");
      }
      var meta = ev.winner
        ? '<span class="win">Settled · '+ev.winner+'</span>'
        : '<span>'+ev.outcomes.length+' outcomes · '+
          money0(ev.outcomes.reduce(function(a,o){ return a+o.vol; },0))+' vol</span>';
      return '<div class="brow '+(ei===state.ei?"sel":"")+(ev.winner?" done":"")+'" data-ev="'+ei+'">'+
        '<span class="st '+(ev.winner?"ok":"")+'">'+(ev.winner?"\u2713":"")+'</span>'+
        '<div class="q"><b>'+ev.q+'</b>'+meta+'</div>'+
        '<div class="picks">'+picks+'</div>'+
        '<span class="arrow">\u203A</span></div>';
    }).join("");
  }

  /* ---------- slip ---------- */
  function renderRanges(){
    $("#rng").innerHTML = ["1D","1W","ALL"].map(function(r){
      return '<button data-range="'+r+'" class="'+(r===state.range?"on":"")+'">'+r+'</button>';
    }).join("");
  }

  function renderSlip(){
    var ev = cur(), settled = isSettled();
    $("#mTitle").textContent = ev.q;
    $("#mSub").textContent = ev.sub;
    $("#slipKicker").textContent = settled ? "Settled market" : "Market";
    $("#slipStatus").textContent = settled ? "Settled" : "Open";
    $("#slipStatus").className = "stt" + (settled ? " g" : "");
    $("#rng").style.display = settled ? "none" : "";

    var box = document.getElementById("settledBox");
    if(settled){
      if(!box){
        box = document.createElement("div");
        box.id = "settledBox"; box.className = "settled";
        $("#cw").replaceWith(box);
      }
      box.innerHTML = '<div class="badge">winner</div><div class="who">'+ev.winner+'</div>'+
        '<div class="at">resolved at 100\u00A2 · market closed</div>';
    } else if(box){
      var wrap = document.createElement("div");
      wrap.className = "chartwrap"; wrap.id = "cw";
      wrap.innerHTML = '<svg class="chart" id="chart"></svg><div class="tip" id="tip"></div>';
      box.replaceWith(wrap);
      svg = $("#chart");
      measure();
    }

    var order = ev.outcomes.map(function(o,i){ return { o:o, i:i }; }).sort(function(a,b){
      return (b.o.px - a.o.px) || a.o.name.localeCompare(b.o.name);
    });
    $("#cands").innerHTML = order.map(function(it){
      var x = it.o, i = it.i;
      return '<div class="cand '+(i===state.out?"on":"")+'" data-cand="'+i+'">'+
        '<span class="cav">'+x.name[0]+'</span>'+
        '<span class="cn">'+x.name+'</span>'+
        '<span class="cq mono '+(x.chg>=0?"up":"down")+'">'+
          (settled ? "" : (x.chg>=0?"+":"")+x.chg.toFixed(1))+'</span>'+
        '<span class="cv mono">'+cents(x.px)+'</span></div>';
    }).join("");

    renderTicket();
  }

  function legKey(ei,oi,side){ return ei+"-"+oi+"-"+side; }
  function payout(){
    var keys = Object.keys(legs);
    if(!keys.length) return null;
    var mult = 1;
    keys.forEach(function(k){
      var p = k.split("-"), o = EVENTS[+p[0]].outcomes[+p[1]];
      var price = p[2] === "yes" ? o.px : 100 - o.px;
      mult *= 100/Math.max(1, price);
    });
    return { n:keys.length, mult:mult, out:10*mult };
  }

  function renderTicket(){
    var ev = cur(), o = curOut();
    if(ev.winner){
      $("#ticket").innerHTML = '<div class="slipbar" style="margin:0">'+
        '<span>Closed. <b>'+ev.winner+'</b> took it at 100\u00A2.</span></div>';
      return;
    }
    var yOn = legs[legKey(state.ei, state.out, "yes")], nOn = legs[legKey(state.ei, state.out, "no")];
    var p = payout();
    var html = '<div class="trow"><span class="lbl">'+o.name+' · $10 stake</span>'+
      '<span class="px mono">'+cents(o.px)+'</span></div>'+
      '<div class="trow" style="margin-top:7px;gap:6px">'+
        '<button class="obtn y '+(yOn?"on":"")+'" data-buy="yes">Yes '+cents(o.px)+'</button>'+
        '<button class="obtn n '+(nOn?"on":"")+'" data-buy="no">No '+cents(100-o.px)+'</button>'+
      '</div>';
    if(p){
      html += '<div class="slipbar"><span><b>'+p.n+' bet'+(p.n>1?"s":"")+'</b> · '+
        p.mult.toFixed(2)+'x · $10 \u2192 <b>'+money0(p.out)+'</b></span>'+
        '<button class="place" id="place">Place</button>'+
        '<button class="clearbtn" id="clear">clear</button></div>';
    } else {
      html += '<div class="slipbar"><span>Tap Yes or No to build a parlay</span></div>';
    }
    $("#ticket").innerHTML = html;
  }

  function renderTicker(){
    var items = EVENTS.map(function(ev){
      if(ev.winner){
        return '<span class="tk"><span class="done">SETTLED</span> '+ev.winner+
          ' <i>'+ev.q+'</i> <b class="mono">100\u00A2</b></span>';
      }
      var o = ev.outcomes[0];
      return '<span class="tk">'+o.name+' <i>'+ev.q+'</i> <b class="mono">'+cents(o.px)+'</b>'+
        '<span class="mono '+(o.chg>=0?"up":"down")+'">'+(o.chg>=0?"\u25B2":"\u25BC")+
        Math.abs(o.chg).toFixed(1)+'</span></span>';
    }).join("");
    $("#ticker").innerHTML = items + items;
  }

  function renderClock(){
    $("#clock").textContent = "Last update " +
      new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  }

  /* ---------- live ---------- */
  function tick(){
    EVENTS.forEach(function(ev){
      if(ev.winner) return;
      ev.outcomes.forEach(function(o){
        o.px = clamp(o.px + (Math.random()-0.5)*1.4, 1, 96);
        o.chg = Math.round((o.chg + (Math.random()-0.5)*0.2) * 10) / 10;
        o.vol += Math.floor(Math.random()*380);
      });
      var sum = ev.outcomes.reduce(function(a,o){ return a + o.px; }, 0);
      ev.outcomes.forEach(function(o){ o.px = clamp(Math.round(o.px*100/sum), 1, 99); });
      balance(ev);
    });
    advance();
    renderBoard(); renderSlip(); renderTicker();
  }

  function toast(msg){
    var el = document.createElement("div");
    el.className = "toast"; el.textContent = msg;
    $("#toasts").appendChild(el);
    setTimeout(function(){
      el.style.transition = "opacity .3s,transform .3s";
      el.style.opacity = 0; el.style.transform = "translateY(5px)";
      setTimeout(function(){ el.remove(); }, 320);
    }, 2600);
  }

  function select(ei){
    state.ei = ei;
    state.out = 0;
    renderBoard(); renderSlip(); measure(); draw();
  }

  /* ---------- clicks ---------- */
  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-buy]");
    if(b){
      if(isSettled()) return;
      var side = b.dataset.buy;
      var k = legKey(state.ei, state.out, side), o = curOut();
      if(legs[k]){ delete legs[k]; toast("Removed \u00B7 "+o.name+" "+side.toUpperCase()); }
      else {
        legs[k] = true;
        toast("Added \u00B7 "+side.toUpperCase()+" "+o.name+" @ "+cents(side==="yes"?o.px:100-o.px));
      }
      renderBoard(); renderTicket(); return;
    }
    var c = e.target.closest("[data-cand]");
    if(c){ state.out = +c.dataset.cand; renderSlip(); draw(); return; }

    var row = e.target.closest("[data-ev]");
    if(row){ select(+row.dataset.ev); return; }

    var rg = e.target.closest("[data-range]");
    if(rg){ state.range = rg.dataset.range; renderRanges(); draw(); return; }

    if(e.target.closest("#place")){
      var p = payout();
      if(p) toast("Bet placed \u00B7 "+p.n+" leg"+(p.n>1?"s":"")+" \u00B7 pays "+money0(p.out)+
        ". You will not be paid.");
      return;
    }
    if(e.target.closest("#clear")){ legs = {}; renderBoard(); renderTicket(); toast("Bet slip cleared."); return; }

    var f = e.target.closest("[data-fake]");
    if(f){ e.preventDefault(); toast(f.dataset.fake+" isn’t part of the joke."); return; }
    if(e.target.closest("#deposit")){ toast("Deposits disabled. Your $1,000 is imaginary."); return; }
  });

  $("#theme").addEventListener("click", function(){
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try{ localStorage.setItem("ks-theme", next); }catch(err){}
    draw();
  });

  /* ---------- boot ---------- */
  try{
    var saved = localStorage.getItem("ks-theme");
    if(saved) document.documentElement.setAttribute("data-theme", saved);
  }catch(err){}

  renderBoard(); renderTicker(); renderRanges();
  renderSlip(); measure(); draw(); renderClock();

  if(window.ResizeObserver){
    new ResizeObserver(function(){ if(measure()) draw(); }).observe($("main"));
  }
  window.addEventListener("resize", function(){ if(measure()) draw(); });

  setInterval(tick, 5200);
  setInterval(renderClock, 30000);
})();
</script>
</body>
</html>
